version: 2
# Every update waits 7 days after its upstream release before Dependabot
# proposes it, so a compromised or broken release is usually caught upstream
# first. Security updates are exempt and still open immediately. Our own
# nos-tromo/* workflows skip the wait, so a hub release is not held back.
# Dependabot can only date Docker Hub images: refreshes of images from other
# registries (ghcr.io, ...) are proposed without the wait, which is where the
# shared CI's signed-provenance check carries the weight.
updates:
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - "nos-tromo/*"
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # pyrefly and ruff are centrally pinned in nos-tromo/.github/configs/
    # python-strict/ and mirrored into pyproject.toml; the strict-config CI
    # check fails on any local drift. They move only when the canonical
    # config moves (manual re-mirror), never via an automated bump here.
    ignore:
      - dependency-name: "pyrefly"
      - dependency-name: "ruff"
