name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Pinned to an immutable commit SHA (v3.11): infra checks + make/common.mk
    # and bundle-lib drift-checks.
    uses: nos-tromo/.github/.github/workflows/infra-validation.yml@589ea4656ecba00c278ea02b4dbf754727b18062 # v3.11
    with:
      compose-files: '-f docker/compose.yaml -f docker/compose.override.yaml'
      dockerfiles-glob: 'docker/Dockerfile.*'
      shell-scripts-glob: 'scripts/*.sh'

  # Lint the bundled FastAPI servers (src/) with the org-wide strict regime.
  # Infra-first with no test suite, so it calls the canonical python-app-ci
  # workflow with run-tests: false — the lint job only (strict-config alignment
  # + ruff + pyrefly via pre-commit). Calling the reusable workflow instead of
  # inlining a copy keeps the canonical ref in lockstep — no hardcoded ref to
  # drift.
  python-lint:
    uses: nos-tromo/.github/.github/workflows/python-app-ci.yml@589ea4656ecba00c278ea02b4dbf754727b18062 # v3.11
    with:
      python-versions: '["3.11"]'
      run-tests: false
      # --locked rather than the shared workflow's '--frozen --group dev'
      # default: --frozen installs uv.lock as-is and exits 0 even when it
      # disagrees with pyproject.toml, which is how this repo's lock silently
      # sat at 0.2.0 through the v0.2.1 release. --locked fails the job
      # instead. Set explicitly because the workflow ref is SHA-pinned, so
      # nos-tromo/.github#44 (flipping that default) only lands here on a ref
      # bump. --group dev pulls pre-commit and the pinned pyrefly for lint.
      uv-sync-args: '--locked --group dev'
