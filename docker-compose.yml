x-proxy-build-args: &proxy-build-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
  http_proxy: ${http_proxy:-}
  https_proxy: ${https_proxy:-}
  no_proxy: ${no_proxy:-}
  OFFLINE_BUILD: ${OFFLINE_BUILD:-}

x-env-file: &env-file
  - .env

x-vllm-env: &vllm-env
  NVIDIA_VISIBLE_DEVICES: all
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
  TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
  FLASHINFER_DISABLE_VERSION_CHECK: 1

x-vllm-volumes: &vllm-volumes
  - huggingface-cache:/root/.cache/huggingface/hub

x-vllm-healthcheck: &vllm-healthcheck
  test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 60
  start_period: 120s

x-cuda-deploy: &cuda-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]
  restart_policy:
    condition: on-failure
    delay: 10s
    max_attempts: 5
    window: 120s

services:
  router:
    image: docker.io/litellm/litellm:main-v1.83.10-stable@sha256:6c82d338a60e7b273ae46bf1d8db814d2856ae010f96c44eeadde574d3893f76
    env_file: *env-file
    depends_on:
      chat:
        condition: service_healthy
      embed:
        condition: service_healthy
      rerank:
        condition: service_healthy
      translate:
        condition: service_healthy
        required: false
      audio:
        condition: service_healthy
        required: false
    environment:
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-Infomaniak-AI/vllm-translategemma-4b-it}
      WHISPER_MODEL: ${WHISPER_MODEL:-openai/whisper-large-v3}
    ports:
      - "${ROUTER_HOST_PORT:-9000}:4000"
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness').read()"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      vllm-net:
      inference-net:
        aliases:
          - vllm-router
    restart: unless-stopped

  chat:
    build:
      context: .
      dockerfile: Dockerfile.vllm
      args:
        <<: *proxy-build-args
    gpus: all
    env_file: *env-file
    ipc: host
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${CHAT_CUDA_VISIBLE_DEVICES:-0}";
        set -- vllm serve "$${TEXT_MODEL:-$${LLM:-palmfuture/Qwen3.6-35B-A3B-GPTQ-Int4}}"
        --tensor-parallel-size "$${CHAT_TENSOR_PARALLEL_SIZE:-1}"
        --api-key "$${OPENAI_API_KEY:-sk-no-key-required}"
        --host 0.0.0.0
        --port 8000
        --gpu-memory-utilization "$${CHAT_GPU_MEMORY_UTILIZATION:-0.5}"
        --max-model-len "$${CHAT_MAX_MODEL_LEN:-8192}"
        --max-num-seqs "$${CHAT_MAX_NUM_SEQS:-8}"
        --max-num-batched-tokens "$${CHAT_MAX_NUM_BATCHED_TOKENS:-16384}";
        if [ -n "$${CHAT_ENFORCE_EAGER:-}" ]; then
          set -- "$@" --enforce-eager;
        fi;
        if [ "$${CHAT_ENABLE_PREFIX_CACHING:-true}" = "true" ]; then
          set -- "$@" --enable-prefix-caching;
        fi;
        if [ -n "$${CHAT_TEMPLATE_CONTENT_FORMAT:-}" ]; then
          set -- "$@" --chat-template-content-format "$${CHAT_TEMPLATE_CONTENT_FORMAT}";
        fi;
        if [ -n "$${CHAT_DEFAULT_CHAT_TEMPLATE_KWARGS:-}" ]; then
          set -- "$@" --default-chat-template-kwargs "$${CHAT_DEFAULT_CHAT_TEMPLATE_KWARGS}";
        fi;
        if [ -n "$${CHAT_LIMIT_MM_PER_PROMPT:-}" ]; then
          set -- "$@" --limit-mm-per-prompt "$${CHAT_LIMIT_MM_PER_PROMPT}";
        fi;
        if [ -n "$${CHAT_CPU_OFFLOAD_GB:-}" ]; then
          set -- "$@" --cpu-offload-gb "$${CHAT_CPU_OFFLOAD_GB}";
        fi;
        exec "$@"
    environment: *vllm-env
    volumes: *vllm-volumes
    healthcheck: *vllm-healthcheck
    deploy: *cuda-deploy
    networks:
      - vllm-net

  embed:
    build:
      context: .
      dockerfile: Dockerfile.vllm
      args:
        <<: *proxy-build-args
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      chat:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${EMBED_CUDA_VISIBLE_DEVICES:-0}";
        set -- vllm serve "$${EMBED_MODEL:-BAAI/bge-m3}"
        --api-key "$${OPENAI_API_KEY:-sk-no-key-required}"
        --host 0.0.0.0
        --port 8000
        --runner "$${EMBED_RUNNER:-pooling}"
        --convert "$${EMBED_CONVERT:-embed}"
        --gpu-memory-utilization "$${EMBED_GPU_MEMORY_UTILIZATION:-0.15}";
        if [ -n "$${EMBED_HF_OVERRIDES:-}" ]; then
          set -- "$@" --hf-overrides "$${EMBED_HF_OVERRIDES}";
        elif [ "$${EMBED_MODEL:-BAAI/bge-m3}" = "BAAI/bge-m3" ]; then
          set -- "$@" --hf-overrides '{"architectures":["BgeM3EmbeddingModel"]}';
        fi;
        exec "$@"
    environment: *vllm-env
    volumes: *vllm-volumes
    healthcheck: *vllm-healthcheck
    deploy: *cuda-deploy
    networks:
      - vllm-net

  rerank:
    build:
      context: .
      dockerfile: Dockerfile.vllm
      args:
        <<: *proxy-build-args
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      embed:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${RERANK_CUDA_VISIBLE_DEVICES:-0}";
        exec vllm serve "$${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}"
        --api-key "$${OPENAI_API_KEY:-sk-no-key-required}"
        --host 0.0.0.0
        --port 8000
        --runner "$${RERANK_RUNNER:-pooling}"
        --gpu-memory-utilization "$${RERANK_GPU_MEMORY_UTILIZATION:-0.15}"
    environment: *vllm-env
    volumes: *vllm-volumes
    healthcheck: *vllm-healthcheck
    deploy: *cuda-deploy
    networks:
      - vllm-net

  audio:
    build:
      context: .
      dockerfile: Dockerfile.vllm
      args:
        <<: *proxy-build-args
    profiles: [media]
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      rerank:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${AUDIO_CUDA_VISIBLE_DEVICES:-0}";
        exec vllm serve "$${WHISPER_MODEL:-openai/whisper-large-v3}"
        --api-key "$${OPENAI_API_KEY:-sk-no-key-required}"
        --host 0.0.0.0
        --port 8000
        --gpu-memory-utilization "$${AUDIO_GPU_MEMORY_UTILIZATION:-0.15}"
    environment:
      <<: *vllm-env
      VLLM_MAX_AUDIO_CLIP_FILESIZE_MB: ${VLLM_MAX_AUDIO_CLIP_FILESIZE_MB:-200}
    volumes: *vllm-volumes
    healthcheck: *vllm-healthcheck
    deploy: *cuda-deploy
    networks:
      - vllm-net

  translate:
    build:
      context: .
      dockerfile: Dockerfile.vllm
      args:
        <<: *proxy-build-args
    profiles: [media]
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      audio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${TRANSLATE_CUDA_VISIBLE_DEVICES:-0}";
        set -- vllm serve "$${TRANSLATE_MODEL:-Infomaniak-AI/vllm-translategemma-4b-it}"
        --tensor-parallel-size "$${TRANSLATE_TENSOR_PARALLEL_SIZE:-1}"
        --api-key "$${OPENAI_API_KEY:-sk-no-key-required}"
        --host 0.0.0.0
        --port 8000
        --gpu-memory-utilization "$${TRANSLATE_GPU_MEMORY_UTILIZATION:-0.15}"
        --max-model-len "$${TRANSLATE_MAX_MODEL_LEN:-2048}"
        --max-num-seqs "$${TRANSLATE_MAX_NUM_SEQS:-8}"
        --max-num-batched-tokens "$${TRANSLATE_MAX_NUM_BATCHED_TOKENS:-4096}";
        if [ "$${TRANSLATE_ENABLE_PREFIX_CACHING:-true}" = "true" ]; then
          set -- "$@" --enable-prefix-caching;
        fi;
        exec "$@"
    environment: *vllm-env
    volumes: *vllm-volumes
    healthcheck: *vllm-healthcheck
    deploy: *cuda-deploy
    networks:
      - vllm-net

volumes:
  huggingface-cache:
    external: true

networks:
  vllm-net:
  inference-net:
    external: true
    name: ${INFERENCE_NETWORK:-inference-net}
