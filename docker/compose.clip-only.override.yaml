### Dev override for the clip-only stack — publishes the CLIP service on
### the host.
###
### NOT auto-loaded: it lives in docker/ and the Makefile passes explicit
### -f flags. `make up-dev-clip-only` layers this on top of
### docker/compose.clip-only.yaml so the service is reachable at
### localhost:${CLIP_HOST_PORT} for direct testing; `make up-clip-only`
### runs the base alone (production shape). Sibling containers reach the
### service as `clip-only:8000` on inference-net regardless of this override.

services:
  clip-only:
    ports:
      - "${CLIP_HOST_PORT:-8003}:8000"
