name: vllm-service-clip-only

# Standalone CPU CLIP stack. Not a profile of compose.yaml — a separate
# compose project for hosts that cannot run the full CUDA stack (macOS,
# CPU-only Linux, AMD/ROCm boxes running Ollama for chat/embed).
#
# Topology:
#   - one container, `clip-only`, on the external `inference-net`
#   - no LiteLLM router, no vLLM backends, no GPU reservation
#   - the existing pass-through URLs `http://vllm-router:4000/clip/*` are
#     unavailable in this shape; consumers point at
#     `http://clip-only:8000/clip/*`
#
# Auth: the container has no built-in Bearer-token gate. `inference-net`
# is a private Docker network shared only between trusted compose
# projects, mirroring how `data-net` exposes Qdrant and how the
# `gliner-only` and `rerank-only` services expose their endpoints.
#
# Pair with `compose.gliner-only.yaml` and `compose.rerank-only.yaml` on
# the same host to give a non-CUDA dev box the full GLiNER + rerank +
# CLIP set against `inference-net`.

x-no-proxy-env: &no-proxy-env
  NO_PROXY: "clip-only,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"
  no_proxy: "clip-only,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"

x-env-file: &env-file
  - path: ../.env
    required: false

# Shared logging — the local driver rotates and compresses
# per-container; tail with `docker compose logs -f <svc>`.
x-logging: &default-logging
  driver: "local"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

# Shared hardening (deploy ADR 0001) — no privilege escalation, no
# capabilities; the image runs as the non-root app user (uid 10001).
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-volume-permissions-dep: &volume-permissions-dep
  volume-permissions:
    condition: service_completed_successfully

services:
  ##########################################################
  # Volume ownership (deploy ADR 0001, self-healing)
  #
  # Backends run as uid 10001, but external volumes keep whatever
  # ownership they were created with (root, on a fresh `docker volume
  # create`) — image-build chowns cannot help, since the volume mount
  # shadows the image path at runtime. This one-shot root container
  # fixes ownership before any backend starts; it reuses the shape's own
  # image so the airgap bundle needs no extra image. The find form only
  # touches wrong-owner entries, so a boot over an already-owned
  # multi-GB huggingface-cache writes nothing. Canonical shape:
  # docint/docker/compose.yaml.
  ##########################################################
  volume-permissions:
    image: vllm-service-clip-cpu:${VLLM_SERVICE_VERSION:-latest}
    logging: *default-logging
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: none
    # Root is the mountpoint itself — its parent dirs live on the
    # read-only image rootfs and must not (and cannot) be chowned.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        find /home/app/.cache/huggingface/hub
        -xdev ! -user 10001 -exec chown -h 10001:10001 {} +
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface/hub
    restart: "no"

  clip-only:
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp:size=64m
    image: vllm-service-clip-cpu:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.clip.cpu
    logging: *default-logging
    env_file: *env-file
    depends_on:
      <<: *volume-permissions-dep
    environment:
      <<: *no-proxy-env
      CLIP_MODEL: ${CLIP_MODEL:-openai/clip-vit-base-patch32}
      CLIP_DEVICE: cpu
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface/hub
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s
    networks:
      inference-net:
        aliases:
          - clip-only
    restart: unless-stopped

volumes:
  huggingface-cache:
    external: true

networks:
  inference-net:
    external: true
    name: ${INFERENCE_NETWORK:-inference-net}
