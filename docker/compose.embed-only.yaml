name: vllm-service-embed-only

# Standalone CPU dense+sparse embedding stack. Not a profile of
# compose.yaml — a separate compose project for hosts that cannot run
# the full CUDA stack (macOS, CPU-only Linux, AMD/ROCm boxes running
# Ollama for chat/embed).
#
# Topology:
#   - one container, `embed-only`, on the external `inference-net`
#   - no LiteLLM router, no vLLM backends, no GPU reservation
#   - the full stack's pass-through URLs `http://vllm-router:4000/v1/embeddings`,
#     `/pooling`, and `/tokenize` are unavailable in this shape; consumers
#     point their embedding base and SPARSE_API_BASE at
#     `http://embed-only:8000`
#
# Auth: the container has no built-in Bearer-token gate. `inference-net`
# is a private Docker network shared only between trusted compose
# projects, mirroring how the `rerank-only` and `gliner-only` services
# expose /rerank and /gliner.

x-no-proxy-env: &no-proxy-env
  NO_PROXY: "embed-only,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"
  no_proxy: "embed-only,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"

x-env-file: &env-file
  - path: ../.env
    required: false

# Shared logging — the local driver rotates and compresses
# per-container; tail with `docker compose logs -f <svc>`.
x-logging: &default-logging
  driver: "local"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

# Shared hardening (deploy ADR 0001) — no privilege escalation, no
# capabilities; the image runs as the non-root app user (uid 10001).
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  embed-only:
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp:size=64m
    image: vllm-service-embed-only:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.embed.cpu
    logging: *default-logging
    env_file: *env-file
    environment:
      <<: *no-proxy-env
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_MAX_LENGTH: ${EMBED_MAX_LENGTH:-8192}
      EMBED_MAX_BATCH_TOKENS: ${EMBED_MAX_BATCH_TOKENS:-16384}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface/hub
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s
    networks:
      inference-net:
        aliases:
          - embed-only
    restart: unless-stopped

volumes:
  huggingface-cache:
    external: true

networks:
  inference-net:
    external: true
    name: ${INFERENCE_NETWORK:-inference-net}
