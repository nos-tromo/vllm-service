name: vllm-service-gliner-only

# Standalone GLiNER NER stack. Not a profile of compose.yaml — a separate
# compose project for hosts that cannot run the full CUDA stack (macOS,
# CPU-only Linux, AMD/ROCm boxes running Ollama for chat/embed).
#
# Topology:
#   - one container, `gliner-only`, on the external `inference-net`
#   - no LiteLLM router, no vLLM backends, no GPU reservation
#   - the existing pass-through URL `http://vllm-router:4000/gliner` is
#     unavailable in this shape; consumers point at `http://gliner-only:8000/gliner`
#
# Auth: the container has no built-in Bearer-token gate (Ray Serve has no
# auth by default). `inference-net` is a private Docker network shared only
# between trusted compose projects, mirroring how `data-net` exposes Qdrant.

x-no-proxy-env: &no-proxy-env
  NO_PROXY: "gliner-only,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"
  no_proxy: "gliner-only,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"

x-env-file: &env-file
  - path: ../.env
    required: false

# Shared logging — the local driver rotates and compresses
# per-container; tail with `docker compose logs -f <svc>`.
x-logging: &default-logging
  driver: "local"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

# Shared hardening (deploy ADR 0001) — no privilege escalation, no
# capabilities; the image runs as the non-root app user (uid 10001).
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-volume-permissions-dep: &volume-permissions-dep
  volume-permissions:
    condition: service_completed_successfully

services:
  ##########################################################
  # Volume ownership (deploy ADR 0001, self-healing)
  #
  # Backends run as uid 10001, but external volumes keep whatever
  # ownership they were created with (root, on a fresh `docker volume
  # create`) — image-build chowns cannot help, since the volume mount
  # shadows the image path at runtime. This one-shot root container
  # fixes ownership before any backend starts; it reuses the shape's own
  # image so the airgap bundle needs no extra image. The find form only
  # touches wrong-owner entries, so a boot over an already-owned
  # multi-GB huggingface-cache writes nothing. Canonical shape:
  # docint/docker/compose.yaml.
  ##########################################################
  volume-permissions:
    image: vllm-service-gliner-cpu:${VLLM_SERVICE_VERSION:-latest}
    # The build: stanza duplicates `gliner-only`'s on purpose: bake dedupes
    # the identical build, and without it `compose pull --ignore-buildable`
    # treats this service as pullable and fails on the local-only image.
    build:
      context: ..
      dockerfile: docker/Dockerfile.gliner.cpu
    logging: *default-logging
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: none
    # Root is the mountpoint itself — its parent dirs live on the
    # read-only image rootfs and must not (and cannot) be chowned.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        find /home/app/.cache/huggingface/hub
        -xdev ! -user 10001 -exec chown -h 10001:10001 {} +
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface/hub
    restart: "no"

  gliner-only:
    <<: *hardened
    # read_only deferred (deploy ADR 0001): Ray needs writable
    # session dirs under /tmp/ray.
    image: vllm-service-gliner-cpu:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.gliner.cpu
    logging: *default-logging
    env_file: *env-file
    depends_on:
      <<: *volume-permissions-dep
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        set -- python -m gliner.serve
        --model "$${NER_MODEL:-gliner-community/gliner_medium-v2.5}"
        --device "$${NER_DEVICE:-cpu}"
        --dtype "$${NER_DTYPE:-float32}"
        --port 8000
        --max-batch-size "$${NER_MAX_BATCH_SIZE:-8}"
        --batch-wait-timeout-ms "$${NER_BATCH_WAIT_TIMEOUT_MS:-50}"
        --target-memory-fraction "$${NER_TARGET_MEMORY_FRACTION:-0.5}"
        --num-replicas "$${NER_NUM_REPLICAS:-1}"
        --num-gpus-per-replica "$${NER_NUM_GPUS_PER_REPLICA:-0}"
        --num-cpus-per-replica "$${NER_NUM_CPUS_PER_REPLICA:-1}";
        if [ "$${NER_ENABLE_FLASHDEBERTA:-false}" = "true" ]; then
          set -- "$@" --enable-flashdeberta;
        fi;
        if [ "$${NER_ENABLE_SEQUENCE_PACKING:-false}" = "true" ]; then
          set -- "$@" --enable-sequence-packing;
        fi;
        if [ "$${NER_DISABLE_COMPILE:-true}" = "true" ]; then
          set -- "$@" --no-compile;
        fi;
        exec /usr/local/bin/gliner-watchdog "$@"
    environment:
      <<: *no-proxy-env
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
    # Ray's object store wants ≥30% of host RAM in /dev/shm. Docker's default
    # is 64 MB, which triggers a "will harm performance" warning and degrades
    # batched throughput. The full-stack `gliner` service avoids this with
    # `ipc: host`, but that's a Linux-only escape hatch and isn't safe to
    # use unconditionally on developer laptops, so we bump shm_size instead.
    shm_size: "${NER_SHM_SIZE:-3gb}"
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface/hub
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -m 10 -X POST -H 'content-type: application/json' -d '{\"text\":\"ping\",\"labels\":[\"person\"],\"threshold\":0.5}' http://localhost:8000/gliner || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      inference-net:
        aliases:
          - gliner-only
    restart: unless-stopped

volumes:
  huggingface-cache:
    external: true

networks:
  inference-net:
    external: true
    name: ${INFERENCE_NETWORK:-inference-net}
