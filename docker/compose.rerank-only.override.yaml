### Dev override for the rerank-only stack — publishes the rerank service
### on the host.
###
### NOT auto-loaded: it lives in docker/ and the Makefile passes explicit
### -f flags. `make up-dev-rerank-only` layers this on top of
### docker/compose.rerank-only.yaml so the service is reachable at
### localhost:${RERANK_HOST_PORT} for direct testing; `make up-rerank-only`
### runs the base alone (production shape). Sibling containers reach the
### service as `rerank-only:8000` on inference-net regardless of this override.

services:
  rerank-only:
    ports:
      - "${RERANK_HOST_PORT:-8002}:8000"
