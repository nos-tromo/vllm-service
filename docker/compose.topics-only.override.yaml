### Dev override for the topics-only stack — publishes the topics service on the host.
###
### NOT auto-loaded: it lives in docker/ and the Makefile passes explicit
### -f flags. `make up-dev-topics-only` layers this on top of
### docker/compose.topics-only.yaml so the service is reachable at
### localhost:${TOPICS_HOST_PORT} for direct testing; `make up-topics-only`
### runs the base alone (production shape). Sibling containers reach the
### service as `topics-only:8000` on inference-net regardless of this override.

services:
  topics-only:
    ports:
      - "${TOPICS_HOST_PORT:-8008}:8000"
