name: vllm-service

x-no-proxy-env: &no-proxy-env
  NO_PROXY: "router,chat,embed,rerank,gliner,clip,asr,diarize,vad,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"
  no_proxy: "router,chat,embed,rerank,gliner,clip,asr,diarize,vad,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"

x-env-file: &env-file
  - path: ../.env
    required: false

x-vllm-env: &vllm-env
  <<: *no-proxy-env
  NVIDIA_VISIBLE_DEVICES: all
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
  TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
  FLASHINFER_DISABLE_VERSION_CHECK: 1

x-vllm-volumes: &vllm-volumes
  - huggingface-cache:/root/.cache/huggingface/hub

x-vllm-healthcheck: &vllm-healthcheck
  test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 60
  start_period: 120s

x-cuda-deploy: &cuda-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]
  restart_policy:
    condition: on-failure
    delay: 10s
    max_attempts: 5
    window: 120s

# Shared logging — the local driver rotates and compresses
# per-container; tail with `docker compose logs -f <svc>`.
x-logging: &default-logging
  driver: "local"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

services:
  router:
    image: docker.io/litellm/litellm:main-v1.83.10-stable@sha256:6c82d338a60e7b273ae46bf1d8db814d2856ae010f96c44eeadde574d3893f76
    logging: *default-logging
    env_file: *env-file
    depends_on:
      chat:
        condition: service_healthy
      embed:
        condition: service_healthy
      rerank:
        condition: service_healthy
      clip:
        condition: service_healthy
      asr:
        condition: service_healthy
      diarize:
        condition: service_healthy
      vad:
        condition: service_healthy
      gliner:
        condition: service_healthy
    environment:
      <<: *no-proxy-env
      WHISPER_MODEL: ${WHISPER_MODEL:-openai/whisper-large-v3}
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness').read()"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      vllm-net:
      inference-net:
        aliases:
          - vllm-router
    restart: unless-stopped

  chat:
    image: vllm-service-chat:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.vllm
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${CHAT_CUDA_VISIBLE_DEVICES:-0}";
        set -- vllm serve "$${TEXT_MODEL:-$${LLM:-palmfuture/Qwen3.6-35B-A3B-GPTQ-Int4}}"
        --tensor-parallel-size "$${CHAT_TENSOR_PARALLEL_SIZE:-1}"
        --api-key "$${OPENAI_API_KEY:-sk-no-key-required}"
        --host 0.0.0.0
        --port 8000
        --gpu-memory-utilization "$${CHAT_GPU_MEMORY_UTILIZATION:-0.5}"
        --max-model-len "$${CHAT_MAX_MODEL_LEN:-8192}"
        --max-num-seqs "$${CHAT_MAX_NUM_SEQS:-8}"
        --max-num-batched-tokens "$${CHAT_MAX_NUM_BATCHED_TOKENS:-16384}";
        if [ -n "$${CHAT_ENFORCE_EAGER:-}" ]; then
          set -- "$@" --enforce-eager;
        fi;
        if [ "$${CHAT_ENABLE_PREFIX_CACHING:-true}" = "true" ]; then
          set -- "$@" --enable-prefix-caching;
        fi;
        if [ -n "$${CHAT_TEMPLATE_CONTENT_FORMAT:-}" ]; then
          set -- "$@" --chat-template-content-format "$${CHAT_TEMPLATE_CONTENT_FORMAT}";
        fi;
        if [ "$${CHAT_ENABLE_AUTO_TOOL_CHOICE:-false}" = "true" ]; then
          set -- "$@" --enable-auto-tool-choice;
        fi;
        if [ -n "$${CHAT_TOOL_CALL_PARSER:-}" ]; then
          set -- "$@" --tool-call-parser "$${CHAT_TOOL_CALL_PARSER}";
        fi;
        if [ -n "$${CHAT_REASONING_PARSER:-}" ]; then
          set -- "$@" --reasoning-parser "$${CHAT_REASONING_PARSER}";
        fi;
        if [ -n "$${CHAT_CHAT_TEMPLATE:-}" ]; then
          set -- "$@" --chat-template "$${CHAT_CHAT_TEMPLATE}";
        fi;
        if [ -n "$${CHAT_DEFAULT_CHAT_TEMPLATE_KWARGS:-}" ]; then
          set -- "$@" --default-chat-template-kwargs "$${CHAT_DEFAULT_CHAT_TEMPLATE_KWARGS}";
        fi;
        if [ -n "$${CHAT_LIMIT_MM_PER_PROMPT:-}" ]; then
          set -- "$@" --limit-mm-per-prompt "$${CHAT_LIMIT_MM_PER_PROMPT}";
        fi;
        if [ -n "$${CHAT_CPU_OFFLOAD_GB:-}" ]; then
          set -- "$@" --cpu-offload-gb "$${CHAT_CPU_OFFLOAD_GB}";
        fi;
        exec "$@"
    environment: *vllm-env
    volumes: *vllm-volumes
    healthcheck: *vllm-healthcheck
    deploy: *cuda-deploy
    networks:
      - vllm-net

  embed:
    image: vllm-service-embed:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.vllm
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      chat:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${EMBED_CUDA_VISIBLE_DEVICES:-0}";
        set -- vllm serve "$${EMBED_MODEL:-BAAI/bge-m3}"
        --api-key "$${OPENAI_API_KEY:-sk-no-key-required}"
        --host 0.0.0.0
        --port 8000
        --runner "$${EMBED_RUNNER:-pooling}"
        --convert "$${EMBED_CONVERT:-embed}"
        --pooler-config.task "$${EMBED_POOLER_TASK:-embed}"
        --gpu-memory-utilization "$${EMBED_GPU_MEMORY_UTILIZATION:-0.15}";
        if [ -n "$${EMBED_HF_OVERRIDES:-}" ]; then
          set -- "$@" --hf-overrides "$${EMBED_HF_OVERRIDES}";
        elif [ "$${EMBED_MODEL:-BAAI/bge-m3}" = "BAAI/bge-m3" ]; then
          set -- "$@" --hf-overrides '{"architectures":["BgeM3EmbeddingModel"]}';
        fi;
        exec "$@"
    environment: *vllm-env
    volumes: *vllm-volumes
    healthcheck: *vllm-healthcheck
    deploy: *cuda-deploy
    networks:
      - vllm-net

  rerank:
    image: vllm-service-rerank:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.vllm
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      embed:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${RERANK_CUDA_VISIBLE_DEVICES:-0}";
        exec vllm serve "$${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}"
        --api-key "$${OPENAI_API_KEY:-sk-no-key-required}"
        --host 0.0.0.0
        --port 8000
        --runner "$${RERANK_RUNNER:-pooling}"
        --pooler-config.task "$${RERANK_POOLER_TASK:-classify}"
        --gpu-memory-utilization "$${RERANK_GPU_MEMORY_UTILIZATION:-0.15}"
    environment: *vllm-env
    volumes: *vllm-volumes
    healthcheck: *vllm-healthcheck
    deploy: *cuda-deploy
    networks:
      - vllm-net

  clip:
    # CLIP image+text embedding tower. Same image/text encoder docint
    # used to load in-process (openai/clip-vit-base-patch32 by default).
    # FastAPI wrapper at docker/clip_server.py exposes /clip/embed_image
    # (multipart or base64 JSON), /clip/embed_text, and /clip/dimension.
    # Routed by LiteLLM as a pass-through; clients POST to
    #   http://<router>:${ROUTER_HOST_PORT}/clip/embed_{image,text}
    image: vllm-service-clip:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.clip.cuda
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      rerank:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${CLIP_CUDA_VISIBLE_DEVICES:-0}";
        exec uvicorn --app-dir /app clip_server:app
        --host 0.0.0.0
        --port 8000
    environment:
      <<: *no-proxy-env
      NVIDIA_VISIBLE_DEVICES: all
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      CLIP_MODEL: ${CLIP_MODEL:-openai/clip-vit-base-patch32}
      CLIP_DEVICE: cuda
    volumes: *vllm-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    deploy: *cuda-deploy
    networks:
      - vllm-net

  asr:
    image: vllm-service-asr:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.vllm
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      clip:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${ASR_CUDA_VISIBLE_DEVICES:-0}";
        exec vllm serve "$${WHISPER_MODEL:-openai/whisper-large-v3}"
        --api-key "$${OPENAI_API_KEY:-sk-no-key-required}"
        --host 0.0.0.0
        --port 8000
        --gpu-memory-utilization "$${ASR_GPU_MEMORY_UTILIZATION:-0.15}"
    environment:
      <<: *vllm-env
      VLLM_MAX_AUDIO_CLIP_FILESIZE_MB: ${VLLM_MAX_AUDIO_CLIP_FILESIZE_MB:-200}
    volumes: *vllm-volumes
    healthcheck: *vllm-healthcheck
    deploy: *cuda-deploy
    networks:
      - vllm-net

  diarize:
    # Speaker diarization (pyannote/speaker-diarization-3.1). Like clip,
    # NOT a vLLM container — pyannote's PyanNet segmentation + WeSpeaker
    # embedding + agglomerative clustering are not vLLM-supported
    # architectures, so a FastAPI wrapper (docker/diarize_server.py)
    # serves the pipeline instead. Endpoint shape:
    #   POST /diarize multipart file=<audio> [+ num/min/max_speakers]
    #     -> {"segments": [{"start", "end", "speaker"}], "speakers": [...]}
    # Sits between asr and gliner in the startup chain: the pipeline
    # allocates a small ad-hoc GPU footprint (no fixed reservation), and
    # every such allocator must be up before Ray Serve's
    # --target-memory-fraction claims the leftover GPU memory.
    image: vllm-service-diarize:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.diarize.cuda
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      asr:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${DIARIZE_CUDA_VISIBLE_DEVICES:-0}";
        exec uvicorn --app-dir /app diarize_server:app
        --host 0.0.0.0
        --port 8000
    environment:
      <<: *no-proxy-env
      NVIDIA_VISIBLE_DEVICES: all
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      # pyannote defaults its hub downloads to ~/.cache/torch/pyannote
      # (PYANNOTE_CACHE) — outside the mounted HF cache. Point it into the
      # shared volume so the gated weights persist and offline mode finds
      # them; it writes the hub-standard models--org--name layout, so the
      # two caches coexist cleanly.
      PYANNOTE_CACHE: /root/.cache/huggingface/hub
      DIARIZE_MODEL: ${DIARIZE_MODEL:-pyannote/speaker-diarization-3.1}
      DIARIZE_DEVICE: ${DIARIZE_DEVICE:-cuda}
    volumes: *vllm-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    deploy: *cuda-deploy
    networks:
      - vllm-net

  vad:
    # Voice activity detection (Silero VAD) via FastAPI. Like clip and
    # diarize, NOT a vLLM container — Silero is a tiny JIT speech/non-speech
    # classifier, not a vLLM-supported architecture, so a FastAPI wrapper
    # (docker/vad_server.py) serves it. Endpoint shape:
    #   POST /vad multipart file=<audio> [+ threshold / *_duration_ms ...]
    #     -> {"segments": [{"start", "end"}], "has_speech", "sampling_rate"}
    # CPU-only (Silero gains nothing from CUDA): no GPU reservation, so it
    # never competes for device memory and is irrelevant to the gliner
    # startup ordering below. The silero-vad package bundles its weights, so
    # nothing is downloaded at runtime.
    image: vllm-service-vad:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.vad.cpu
    logging: *default-logging
    env_file: *env-file
    depends_on:
      diarize:
        condition: service_healthy
    environment:
      <<: *no-proxy-env
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      VAD_MODEL: ${VAD_MODEL:-silero_vad}
      VAD_DEVICE: cpu
      VAD_USE_ONNX: ${VAD_USE_ONNX:-false}
    volumes: *vllm-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    networks:
      - vllm-net

  gliner:
    # GLiNER zero-shot NER served via Ray Serve. Unlike the other backends,
    # this is NOT a vLLM container — GLiNER's span-matching head isn't a
    # stock HF classification head and the DeBERTa-v2/v3 attention used by
    # the v2.5 checkpoints is not natively supported by vLLM, so we use
    # the upstream Ray-Serve-based server instead. Endpoint shape:
    #   POST /gliner {"text", "labels", "threshold"} -> {"entities": [...]}
    # GLiNER must be started after the vLLM-native services because it does
    # not allocate a fixed GPU memory fraction at startup and can OOM if it
    # starts before the others.
    image: vllm-service-gliner:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.gliner.cuda
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      vad:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${NER_CUDA_VISIBLE_DEVICES:-0}";
        set -- python -m gliner.serve
        --model "$${NER_MODEL:-gliner-community/gliner_large-v2.5}"
        --device "$${NER_DEVICE:-cuda}"
        --dtype "$${NER_DTYPE:-bfloat16}"
        --port 8000
        --max-batch-size "$${NER_MAX_BATCH_SIZE:-32}"
        --batch-wait-timeout-ms "$${NER_BATCH_WAIT_TIMEOUT_MS:-10}"
        --target-memory-fraction "$${NER_TARGET_MEMORY_FRACTION:-0.8}"
        --num-replicas "$${NER_NUM_REPLICAS:-1}";
        if [ -n "$${NER_QUANTIZATION:-}" ]; then
          set -- "$@" --quantization "$${NER_QUANTIZATION}";
        fi;
        if [ "$${NER_ENABLE_FLASHDEBERTA:-false}" = "true" ]; then
          set -- "$@" --enable-flashdeberta;
        fi;
        if [ "$${NER_ENABLE_SEQUENCE_PACKING:-false}" = "true" ]; then
          set -- "$@" --enable-sequence-packing;
        fi;
        if [ "$${NER_DISABLE_COMPILE:-false}" = "true" ]; then
          set -- "$@" --no-compile;
        fi;
        exec "$@"
    environment:
      <<: *no-proxy-env
      NVIDIA_VISIBLE_DEVICES: all
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
    volumes: *vllm-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/-/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    deploy: *cuda-deploy
    networks:
      - vllm-net

volumes:
  huggingface-cache:
    external: true

networks:
  vllm-net:
  inference-net:
    external: true
    name: ${INFERENCE_NETWORK:-inference-net}
