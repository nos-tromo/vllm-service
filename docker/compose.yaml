name: vllm-service

x-no-proxy-env: &no-proxy-env
  NO_PROXY: "router,chat,embed,rerank,gliner,clip,asr,diarize,vad,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"
  no_proxy: "router,chat,embed,rerank,gliner,clip,asr,diarize,vad,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"

x-env-file: &env-file
  - path: ../.env
    required: false

x-vllm-env: &vllm-env
  # Belt-and-braces: also baked into every image (deploy ADR 0001).
  HF_HUB_CACHE: /home/app/.cache/huggingface/hub
  <<: *no-proxy-env
  NVIDIA_VISIBLE_DEVICES: all
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
  TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
  FLASHINFER_DISABLE_VERSION_CHECK: 1

x-vllm-volumes: &vllm-volumes
  - huggingface-cache:/home/app/.cache/huggingface/hub

x-vllm-healthcheck: &vllm-healthcheck
  test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 60
  start_period: 120s

x-cuda-deploy: &cuda-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]
  restart_policy:
    condition: on-failure
    delay: 10s
    max_attempts: 5
    window: 120s

# Shared logging — the local driver rotates and compresses
# per-container; tail with `docker compose logs -f <svc>`.
x-logging: &default-logging
  driver: "local"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

##########################################################
# Shared hardening (deploy ADR 0001) — no privilege
# escalation, no capabilities; every image runs as the
# non-root app user (uid 10001; router: upstream non_root
# image). read_only where the service tolerates it — chat
# (torch-compile cache) and gliner (Ray session dirs)
# keep a writable rootfs for now, documented deferrals.
# read_only vLLM backends additionally carry a tmpfs at
# ~/.cache/vllm: vLLM 0.26 writes runtime caches there
# (modelinfos, flashinfer autotune) even on pooling runners.
##########################################################
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-volume-permissions-dep: &volume-permissions-dep
  volume-permissions:
    condition: service_completed_successfully

services:
  ##########################################################
  # Volume ownership (deploy ADR 0001, self-healing)
  #
  # Backends run as uid 10001, but external volumes keep whatever
  # ownership they were created with (root, on a fresh `docker volume
  # create`) — image-build chowns cannot help, since the volume mount
  # shadows the image path at runtime. This one-shot root container
  # fixes ownership before any backend starts; it reuses the vad image
  # so the airgap bundle needs no extra image. The find form only
  # touches wrong-owner entries, so a boot over an already-owned
  # multi-GB huggingface-cache writes nothing. Canonical shape:
  # docint/docker/compose.yaml.
  ##########################################################
  volume-permissions:
    image: vllm-service-vad:${VLLM_SERVICE_VERSION:-latest}
    # The build: stanza duplicates `vad`'s on purpose: bake dedupes the
    # identical build, and without it `compose pull --ignore-buildable`
    # treats this service as pullable and fails on the local-only image.
    build:
      context: ..
      dockerfile: docker/Dockerfile.vad.cpu
    logging: *default-logging
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: none
    # Root is the mountpoint itself — its parent dirs live on the
    # read-only image rootfs and must not (and cannot) be chowned.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        find /home/app/.cache/huggingface/hub
        -xdev ! -user 10001 -exec chown -h 10001:10001 {} +
    volumes: *vllm-volumes
    restart: "no"

  router:
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Upstream's supported non-root variant (runs as its internal user)
    # — deploy ADR 0001.
    image: ghcr.io/berriai/litellm-non_root:main-v1.83.10-stable@sha256:94b43b6e65b2b4b8d2e5f3fb2ef288688045f80841f8cf61e0a935a69eb8e2d0
    logging: *default-logging
    env_file: *env-file
    depends_on:
      chat:
        condition: service_healthy
      embed:
        condition: service_healthy
      rerank:
        condition: service_healthy
      clip:
        condition: service_healthy
      asr:
        condition: service_healthy
      diarize:
        condition: service_healthy
      vad:
        condition: service_healthy
      gliner:
        condition: service_healthy
    environment:
      <<: *no-proxy-env
      WHISPER_MODEL: ${WHISPER_MODEL:-openai/whisper-large-v3}
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness').read()"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      vllm-net:
      inference-net:
        aliases:
          - vllm-router
    restart: unless-stopped

  # Backends below also join inference-net (in addition to vllm-net) so the
  # obs-plane observability stack can scrape their metrics endpoints by
  # service name. This does not change the app-facing entry point: apps
  # still talk to the router (alias vllm-router) exclusively, and any
  # backend --api-key enforcement (chat/embed/rerank/asr, all native
  # `vllm serve`) is unaffected.
  chat:
    <<: *hardened
    # read_only deferred (deploy ADR 0001): torch-compile cache under ~/.cache/vllm needs a writable rootfs.
    image: vllm-service-chat:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.vllm
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      <<: *volume-permissions-dep
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${CHAT_CUDA_VISIBLE_DEVICES:-0}";
        set -- vllm serve "$${TEXT_MODEL:-$${LLM:-palmfuture/Qwen3.6-35B-A3B-GPTQ-Int4}}"
        --tensor-parallel-size "$${CHAT_TENSOR_PARALLEL_SIZE:-1}"
        --api-key "$${OPENAI_API_KEY:-sk-no-key-required}"
        --host 0.0.0.0
        --port 8000
        --gpu-memory-utilization "$${CHAT_GPU_MEMORY_UTILIZATION:-0.5}"
        --max-model-len "$${CHAT_MAX_MODEL_LEN:-8192}"
        --max-num-seqs "$${CHAT_MAX_NUM_SEQS:-8}"
        --max-num-batched-tokens "$${CHAT_MAX_NUM_BATCHED_TOKENS:-16384}";
        if [ -n "$${CHAT_ENFORCE_EAGER:-}" ]; then
          set -- "$@" --enforce-eager;
        fi;
        if [ "$${CHAT_ENABLE_PREFIX_CACHING:-true}" = "true" ]; then
          set -- "$@" --enable-prefix-caching;
        fi;
        if [ -n "$${CHAT_TEMPLATE_CONTENT_FORMAT:-}" ]; then
          set -- "$@" --chat-template-content-format "$${CHAT_TEMPLATE_CONTENT_FORMAT}";
        fi;
        if [ "$${CHAT_ENABLE_AUTO_TOOL_CHOICE:-false}" = "true" ]; then
          set -- "$@" --enable-auto-tool-choice;
        fi;
        if [ -n "$${CHAT_TOOL_CALL_PARSER:-}" ]; then
          set -- "$@" --tool-call-parser "$${CHAT_TOOL_CALL_PARSER}";
        fi;
        if [ -n "$${CHAT_REASONING_PARSER:-}" ]; then
          set -- "$@" --reasoning-parser "$${CHAT_REASONING_PARSER}";
        fi;
        if [ -n "$${CHAT_CHAT_TEMPLATE:-}" ]; then
          set -- "$@" --chat-template "$${CHAT_CHAT_TEMPLATE}";
        fi;
        if [ -n "$${CHAT_DEFAULT_CHAT_TEMPLATE_KWARGS:-}" ]; then
          set -- "$@" --default-chat-template-kwargs "$${CHAT_DEFAULT_CHAT_TEMPLATE_KWARGS}";
        fi;
        if [ -n "$${CHAT_LIMIT_MM_PER_PROMPT:-}" ]; then
          set -- "$@" --limit-mm-per-prompt "$${CHAT_LIMIT_MM_PER_PROMPT}";
        fi;
        if [ -n "$${CHAT_CPU_OFFLOAD_GB:-}" ]; then
          set -- "$@" --cpu-offload-gb "$${CHAT_CPU_OFFLOAD_GB}";
        fi;
        if [ -n "$${CHAT_KV_CACHE_DTYPE:-}" ]; then
          set -- "$@" --kv-cache-dtype "$${CHAT_KV_CACHE_DTYPE}";
        fi;
        if [ -n "$${CHAT_SPECULATIVE_CONFIG:-}" ]; then
          set -- "$@" --speculative-config "$${CHAT_SPECULATIVE_CONFIG}";
        fi;
        exec "$@"
    environment: *vllm-env
    volumes: *vllm-volumes
    healthcheck: *vllm-healthcheck
    deploy: *cuda-deploy
    networks:
      - vllm-net
      - inference-net

  embed:
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp:size=64m
      # vLLM 0.26 writes runtime caches under VLLM_CACHE_ROOT even on
      # pooling runners (modelinfos, flashinfer autotune) — EngineCore
      # dies on a read-only rootfs without this.
      - /home/app/.cache/vllm:size=256m,mode=1777,exec
    image: vllm-service-embed:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.vllm
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      <<: *volume-permissions-dep
      chat:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${EMBED_CUDA_VISIBLE_DEVICES:-0}";
        set -- vllm serve "$${EMBED_MODEL:-BAAI/bge-m3}"
        --api-key "$${OPENAI_API_KEY:-sk-no-key-required}"
        --host 0.0.0.0
        --port 8000
        --runner "$${EMBED_RUNNER:-pooling}"
        --convert "$${EMBED_CONVERT:-embed}"
        --pooler-config.task "$${EMBED_POOLER_TASK:-embed}"
        --gpu-memory-utilization "$${EMBED_GPU_MEMORY_UTILIZATION:-0.15}";
        if [ -n "$${EMBED_HF_OVERRIDES:-}" ]; then
          set -- "$@" --hf-overrides "$${EMBED_HF_OVERRIDES}";
        elif [ "$${EMBED_MODEL:-BAAI/bge-m3}" = "BAAI/bge-m3" ]; then
          set -- "$@" --hf-overrides '{"architectures":["BgeM3EmbeddingModel"]}';
        fi;
        exec "$@"
    environment: *vllm-env
    volumes: *vllm-volumes
    healthcheck: *vllm-healthcheck
    deploy: *cuda-deploy
    networks:
      - vllm-net
      - inference-net

  embed-sparse:
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp:size=64m
      # See embed: vLLM 0.26 runtime caches need a writable VLLM_CACHE_ROOT.
      - /home/app/.cache/vllm:size=256m,mode=1777,exec
    # Sparse/lexical (token_classify) twin of `embed`. vLLM 0.25 binds one
    # pooling task per server and rejects per-request `task` switching, so
    # the /pooling (and /tokenize) contract moved here while `embed` keeps
    # /v1/embeddings. Same image, same model — only the pooler task differs;
    # the router still presents all three routes on one base URL.
    # The build: stanza duplicates `embed`'s on purpose: bake dedupes the
    # identical build, and without it `compose pull --ignore-buildable`
    # treats this service as pullable and fails on the local-only image.
    image: vllm-service-embed:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.vllm
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      <<: *volume-permissions-dep
      embed:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${EMBED_CUDA_VISIBLE_DEVICES:-0}";
        set -- vllm serve "$${EMBED_MODEL:-BAAI/bge-m3}"
        --api-key "$${OPENAI_API_KEY:-sk-no-key-required}"
        --host 0.0.0.0
        --port 8000
        --runner "$${EMBED_RUNNER:-pooling}"
        --convert "$${EMBED_CONVERT:-embed}"
        --pooler-config.task token_classify
        --gpu-memory-utilization "$${EMBED_SPARSE_GPU_MEMORY_UTILIZATION:-0.10}";
        if [ -n "$${EMBED_HF_OVERRIDES:-}" ]; then
          set -- "$@" --hf-overrides "$${EMBED_HF_OVERRIDES}";
        elif [ "$${EMBED_MODEL:-BAAI/bge-m3}" = "BAAI/bge-m3" ]; then
          set -- "$@" --hf-overrides '{"architectures":["BgeM3EmbeddingModel"]}';
        fi;
        exec "$@"
    environment: *vllm-env
    volumes: *vllm-volumes
    healthcheck: *vllm-healthcheck
    deploy: *cuda-deploy
    networks:
      - vllm-net
      - inference-net

  rerank:
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp:size=64m
      # vLLM 0.26 writes runtime caches under VLLM_CACHE_ROOT even on
      # pooling runners (modelinfos, flashinfer autotune) — EngineCore
      # dies on a read-only rootfs without this.
      - /home/app/.cache/vllm:size=256m,mode=1777,exec
    image: vllm-service-rerank:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.vllm
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      <<: *volume-permissions-dep
      embed-sparse:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${RERANK_CUDA_VISIBLE_DEVICES:-0}";
        exec vllm serve "$${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}"
        --api-key "$${OPENAI_API_KEY:-sk-no-key-required}"
        --host 0.0.0.0
        --port 8000
        --runner "$${RERANK_RUNNER:-pooling}"
        --pooler-config.task "$${RERANK_POOLER_TASK:-classify}"
        --gpu-memory-utilization "$${RERANK_GPU_MEMORY_UTILIZATION:-0.15}"
    environment: *vllm-env
    volumes: *vllm-volumes
    healthcheck: *vllm-healthcheck
    deploy: *cuda-deploy
    networks:
      - vllm-net
      - inference-net

  clip:
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # CLIP image+text embedding tower. Same image/text encoder docint
    # used to load in-process (openai/clip-vit-base-patch32 by default).
    # FastAPI wrapper at src/clip_server.py exposes /clip/embed_image
    # (multipart or base64 JSON), /clip/embed_text, and /clip/dimension.
    # Routed by LiteLLM as a pass-through; clients POST to
    #   http://<router>:${ROUTER_HOST_PORT}/clip/embed_{image,text}
    image: vllm-service-clip:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.clip.cuda
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      <<: *volume-permissions-dep
      rerank:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${CLIP_CUDA_VISIBLE_DEVICES:-0}";
        exec uvicorn --app-dir /app clip_server:app
        --host 0.0.0.0
        --port 8000
    environment:
      <<: *no-proxy-env
      NVIDIA_VISIBLE_DEVICES: all
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      CLIP_MODEL: ${CLIP_MODEL:-openai/clip-vit-base-patch32}
      CLIP_DEVICE: cuda
    volumes: *vllm-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    deploy: *cuda-deploy
    networks:
      - vllm-net
      - inference-net

  asr:
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp:size=2g
      # See embed: vLLM 0.26 runtime caches need a writable VLLM_CACHE_ROOT.
      - /home/app/.cache/vllm:size=256m,mode=1777,exec
    image: vllm-service-asr:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.vllm
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      <<: *volume-permissions-dep
      clip:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${ASR_CUDA_VISIBLE_DEVICES:-0}";
        exec vllm serve "$${WHISPER_MODEL:-openai/whisper-large-v3}"
        --api-key "$${OPENAI_API_KEY:-sk-no-key-required}"
        --host 0.0.0.0
        --port 8000
        --gpu-memory-utilization "$${ASR_GPU_MEMORY_UTILIZATION:-0.15}"
    environment:
      <<: *vllm-env
      VLLM_MAX_AUDIO_CLIP_FILESIZE_MB: ${VLLM_MAX_AUDIO_CLIP_FILESIZE_MB:-200}
      # vLLM >=0.26 rejects audio longer than this many decoded seconds
      # (upstream default 600). 0 disables the check; keep it bounded so a
      # small compressed upload can't expand into tens of GB of PCM.
      VLLM_MAX_AUDIO_DECODE_DURATION_S: ${VLLM_MAX_AUDIO_DECODE_DURATION_S:-14400}
    volumes: *vllm-volumes
    healthcheck: *vllm-healthcheck
    deploy: *cuda-deploy
    networks:
      - vllm-net
      - inference-net

  diarize:
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp:size=2g
    # Speaker diarization (pyannote/speaker-diarization-3.1). Like clip,
    # NOT a vLLM container — pyannote's PyanNet segmentation + WeSpeaker
    # embedding + agglomerative clustering are not vLLM-supported
    # architectures, so a FastAPI wrapper (src/diarize_server.py)
    # serves the pipeline instead. Endpoint shape:
    #   POST /diarize multipart file=<audio> [+ num/min/max_speakers]
    #     -> {"segments": [{"start", "end", "speaker"}], "speakers": [...]}
    # Sits between asr and gliner in the startup chain: the pipeline
    # allocates a small ad-hoc GPU footprint (no fixed reservation), and
    # every such allocator must be up before Ray Serve's
    # --target-memory-fraction claims the leftover GPU memory.
    image: vllm-service-diarize:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.diarize.cuda
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      <<: *volume-permissions-dep
      asr:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${DIARIZE_CUDA_VISIBLE_DEVICES:-0}";
        exec uvicorn --app-dir /app diarize_server:app
        --host 0.0.0.0
        --port 8000
    environment:
      <<: *no-proxy-env
      NVIDIA_VISIBLE_DEVICES: all
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      # pyannote defaults its hub downloads to ~/.cache/torch/pyannote
      # (PYANNOTE_CACHE) — outside the mounted HF cache. Point it into the
      # shared volume so the gated weights persist and offline mode finds
      # them; it writes the hub-standard models--org--name layout, so the
      # two caches coexist cleanly.
      PYANNOTE_CACHE: /home/app/.cache/huggingface/hub
      DIARIZE_MODEL: ${DIARIZE_MODEL:-pyannote/speaker-diarization-community-1}
      DIARIZE_DEVICE: ${DIARIZE_DEVICE:-cuda}
      # VAD gating: crop /diarize turns to the vad service's Silero speech
      # timeline (drops music/noise over-detected as speech; measured −35%
      # false alarm). On by default in the full stack; DIARIZE_VAD_GATE=off
      # disables, and the gate fails open if vad is unreachable. Request-time
      # call — no depends_on needed (router traffic starts after vad is
      # healthy anyway).
      DIARIZE_VAD_URL: ${DIARIZE_VAD_URL:-http://vad:8000}
      DIARIZE_VAD_GATE: ${DIARIZE_VAD_GATE:-true}
      DIARIZE_VAD_THRESHOLD: ${DIARIZE_VAD_THRESHOLD:-0.4}
      DIARIZE_VAD_PAD_MS: ${DIARIZE_VAD_PAD_MS:-100}
      DIARIZE_VAD_TIMEOUT: ${DIARIZE_VAD_TIMEOUT:-30}
    volumes: *vllm-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    deploy: *cuda-deploy
    networks:
      - vllm-net
      - inference-net

  vad:
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp:size=2g
    # Voice activity detection (Silero VAD) via FastAPI. Like clip and
    # diarize, NOT a vLLM container — Silero is a tiny JIT speech/non-speech
    # classifier, not a vLLM-supported architecture, so a FastAPI wrapper
    # (src/vad_server.py) serves it. Endpoint shape:
    #   POST /vad multipart file=<audio> [+ threshold / *_duration_ms ...]
    #     -> {"segments": [{"start", "end"}], "has_speech", "sampling_rate"}
    # CPU-only (Silero gains nothing from CUDA): no GPU reservation, so it
    # never competes for device memory and is irrelevant to the gliner
    # startup ordering below. The silero-vad package bundles its weights, so
    # nothing is downloaded at runtime.
    image: vllm-service-vad:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.vad.cpu
    logging: *default-logging
    env_file: *env-file
    depends_on:
      <<: *volume-permissions-dep
      diarize:
        condition: service_healthy
    environment:
      <<: *no-proxy-env
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      VAD_MODEL: ${VAD_MODEL:-silero_vad}
      VAD_DEVICE: cpu
      VAD_USE_ONNX: ${VAD_USE_ONNX:-false}
    volumes: *vllm-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    networks:
      - vllm-net
      - inference-net

  gliner:
    <<: *hardened
    # read_only deferred (deploy ADR 0001): Ray needs writable session dirs under /tmp/ray.
    # GLiNER zero-shot NER served via Ray Serve. Unlike the other backends,
    # this is NOT a vLLM container — GLiNER's span-matching head isn't a
    # stock HF classification head and the DeBERTa-v2/v3 attention used by
    # the v2.5 checkpoints is not natively supported by vLLM, so we use
    # the upstream Ray-Serve-based server instead. Endpoint shape:
    #   POST /gliner {"text", "labels", "threshold"} -> {"entities": [...]}
    # GLiNER must be started after the vLLM-native services because it does
    # not allocate a fixed GPU memory fraction at startup and can OOM if it
    # starts before the others.
    image: vllm-service-gliner:${VLLM_SERVICE_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.gliner.cuda
    logging: *default-logging
    gpus: all
    env_file: *env-file
    ipc: host
    depends_on:
      <<: *volume-permissions-dep
      vad:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        export CUDA_VISIBLE_DEVICES="$${NER_CUDA_VISIBLE_DEVICES:-0}";
        set -- python -m gliner.serve
        --model "$${NER_MODEL:-gliner-community/gliner_large-v2.5}"
        --device "$${NER_DEVICE:-cuda}"
        --dtype "$${NER_DTYPE:-bfloat16}"
        --port 8000
        --max-batch-size "$${NER_MAX_BATCH_SIZE:-32}"
        --batch-wait-timeout-ms "$${NER_BATCH_WAIT_TIMEOUT_MS:-10}"
        --target-memory-fraction "$${NER_TARGET_MEMORY_FRACTION:-0.8}"
        --num-replicas "$${NER_NUM_REPLICAS:-1}";
        if [ -n "$${NER_QUANTIZATION:-}" ]; then
          set -- "$@" --quantization "$${NER_QUANTIZATION}";
        fi;
        if [ "$${NER_ENABLE_FLASHDEBERTA:-false}" = "true" ]; then
          set -- "$@" --enable-flashdeberta;
        fi;
        if [ "$${NER_ENABLE_SEQUENCE_PACKING:-false}" = "true" ]; then
          set -- "$@" --enable-sequence-packing;
        fi;
        if [ "$${NER_DISABLE_COMPILE:-false}" = "true" ]; then
          set -- "$@" --no-compile;
        fi;
        exec /usr/local/bin/gliner-watchdog "$@"
    environment:
      <<: *no-proxy-env
      NVIDIA_VISIBLE_DEVICES: all
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      # Ray's node-memory monitor OOM-kills Serve workers when host RAM
      # usage crosses this fraction (Ray default 0.95). On RAM-tight hosts
      # the kill loop prevents gliner from ever finishing a model load —
      # raise toward 0.98 there. (Full disable would be
      # RAY_memory_monitor_refresh_ms=0, which hands the decision to the
      # kernel OOM killer; not exposed.)
      RAY_memory_usage_threshold: ${NER_RAY_MEMORY_THRESHOLD:-0.95}
    volumes: *vllm-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -m 10 -X POST -H 'content-type: application/json' -d '{\"text\":\"ping\",\"labels\":[\"person\"],\"threshold\":0.5}' http://localhost:8000/gliner || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy: *cuda-deploy
    restart: unless-stopped
    networks:
      - vllm-net
      - inference-net

volumes:
  huggingface-cache:
    external: true

networks:
  vllm-net:
  inference-net:
    external: true
    name: ${INFERENCE_NETWORK:-inference-net}
