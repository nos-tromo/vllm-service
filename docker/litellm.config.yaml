# LiteLLM Proxy configuration for the vLLM service stack.
#
# This config fronts the vLLM backends (chat, embed, rerank, asr) and
# exposes a single OpenAI-compatible endpoint at :4000.
#
# Model names are read from environment variables via the os.environ/
# syntax. Set TEXT_MODEL, EMBED_MODEL, and WHISPER_MODEL in .env; both
# docker-compose and LiteLLM will pick them up automatically with no
# further changes required here.
# Note: the LLM fallback alias in docker-compose is not visible to
# LiteLLM — always set TEXT_MODEL explicitly in .env.

model_list:
  # General-purpose chat
  - model_name: os.environ/TEXT_MODEL
    litellm_params:
      model: os.environ/TEXT_MODEL
      custom_llm_provider: openai
      api_base: http://chat:8000/v1
      api_key: os.environ/OPENAI_API_KEY

  # Embeddings
  - model_name: os.environ/EMBED_MODEL
    litellm_params:
      model: os.environ/EMBED_MODEL
      custom_llm_provider: openai
      api_base: http://embed:8000/v1
      api_key: os.environ/OPENAI_API_KEY
      # vLLM (v0.20.1) rejects an explicit `encoding_format: null`, which LiteLLM
      # injects whenever an OpenAI-style client omits the field — e.g. Open WebUI's
      # hand-rolled aiohttp embeddings call (its RAG/document ingestion). Pin a valid
      # default so the null never reaches the backend. Clients that send their own
      # value still override this (the openai SDK defaults to "base64"), so SDK-based
      # consumers like docint are unaffected.
      encoding_format: float

  # Reranking — must use hosted_vllm provider; LiteLLM's native /v1/rerank
  # route takes precedence over pass_through_endpoints and rejects openai.
  # api_base has no /v1 suffix: hosted_vllm appends /rerank directly,
  # matching vLLM's canonical endpoint (JinaAI format, not OpenAI-style).
  - model_name: os.environ/RERANK_MODEL
    litellm_params:
      model: os.environ/RERANK_MODEL
      custom_llm_provider: hosted_vllm
      api_base: http://rerank:8000
      api_key: os.environ/OPENAI_API_KEY

  # Audio transcription / translation — must use hosted_vllm, not openai.
  # WHISPER_MODEL is openai/whisper-large-v3, and the openai provider treats
  # the leading "openai/" as its own route prefix and strips it, forwarding a
  # bare "whisper-large-v3" upstream — which the vLLM backend (serving the
  # model under its full HF id "openai/whisper-large-v3") rejects with 404.
  # hosted_vllm is openai-compatible for /v1/audio/transcriptions (same
  # handler) but forwards the model id verbatim. Unlike the /rerank route
  # above, api_base keeps its /v1 suffix: the openai-compatible transcription
  # handler appends /audio/transcriptions.
  - model_name: os.environ/WHISPER_MODEL
    litellm_params:
      model: os.environ/WHISPER_MODEL
      custom_llm_provider: hosted_vllm
      api_base: http://asr:8000/v1
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  # The master key gates access to the proxy. Clients must present it as
  # `Authorization: Bearer <key>`. Reuses OPENAI_API_KEY from .env so the
  # existing consumer configuration keeps working without changes.
  master_key: os.environ/OPENAI_API_KEY

  # Pass-through endpoints for vLLM-specific paths that LiteLLM does not
  # map natively. Forwards the request body unchanged to the upstream.
  pass_through_endpoints:
    - path: "/pooling"
      target: "http://embed:8000/pooling"
      headers:
        content-type: "application/json"
    - path: "/tokenize"
      target: "http://embed:8000/tokenize"
      headers:
        content-type: "application/json"
    # GLiNER zero-shot NER. Not OpenAI-compatible — clients POST
    #   {"text": "...", "labels": [...], "threshold": 0.5}
    # and receive {"entities": [{"start", "end", "text", "label", "score"}]}.
    # The gliner backend does not appear in /v1/models because it is not in
    # model_list — it has no OpenAI-shaped endpoint to route by model name.
    - path: "/gliner"
      target: "http://gliner:8000/gliner"
      headers:
        content-type: "application/json"
    # CLIP image+text embedding tower. Not OpenAI-compatible — clients POST
    # an image (multipart `file` or JSON `{"image_b64": ...}`) or a query
    # string and receive `{"embedding": [...], "dimension": int}`. Used by
    # docint's image-ingestion path (`docint/utils/clip_client.py`).
    # /clip/embed_image is multipart; the headers block is omitted so
    # LiteLLM forwards the original Content-Type (multipart boundary).
    - path: "/clip/embed_image"
      target: "http://clip:8000/clip/embed_image"
    - path: "/clip/embed_text"
      target: "http://clip:8000/clip/embed_text"
      headers:
        content-type: "application/json"
    - path: "/clip/dimension"
      target: "http://clip:8000/clip/dimension"
    # Speaker diarization (pyannote). Not OpenAI-compatible — clients POST
    # multipart `file=<audio bytes>` plus optional num_speakers /
    # min_speakers / max_speakers form fields and receive
    # {"segments": [{"start", "end", "speaker"}], "speakers": [...]}.
    # Like /clip/embed_image, the headers block is omitted so LiteLLM
    # forwards the original Content-Type (multipart boundary) intact.
    # The diarize backend is not in model_list and does not appear in
    # /v1/models — it has no OpenAI-shaped endpoint to route by model name.
    - path: "/diarize"
      target: "http://diarize:8000/diarize"
    # Voice activity detection (Silero VAD). Not OpenAI-compatible — clients
    # POST multipart `file=<audio bytes>` plus optional threshold / duration
    # form fields and receive {"segments": [{"start", "end"}], "has_speech":
    # bool, "sampling_rate": 16000}. Like /diarize, the headers block is
    # omitted so LiteLLM forwards the original Content-Type (multipart
    # boundary). The vad backend is not in model_list and does not appear in
    # /v1/models — it has no OpenAI-shaped endpoint to route by model name.
    - path: "/vad"
      target: "http://vad:8000/vad"

litellm_settings:
  # Silently drop OpenAI-only params that the upstream vLLM backend does
  # not understand, rather than erroring out the request.
  drop_params: true
  set_verbose: false

router_settings:
  routing_strategy: simple-shuffle
