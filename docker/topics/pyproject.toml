[project]
name = "vllm-service-topics"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "bertopic==0.17.4",
    "umap-learn==0.5.12",
    "hdbscan==0.8.44",
    "numpy>=2.0,<2.6",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6",
    "pyyaml>=6",
    "packaging>=24",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.33",
    "pydantic>=2.14.2",
    "anyio>=4.16.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "httpx>=0.27"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
# BERTopic hard-requires both, but imports neither without an embedding model or plots.
exclude-dependencies = ["sentence-transformers", "plotly"]
