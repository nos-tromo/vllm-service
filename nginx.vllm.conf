server {
    listen 9000;
    client_max_body_size 256m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location = /v1/audio/transcriptions {
        proxy_request_buffering off;
        proxy_pass http://audio:8000/v1/audio/transcriptions;
    }

    location = /v1/audio/translations {
        proxy_request_buffering off;
        proxy_pass http://audio:8000/v1/audio/translations;
    }

    location = /v1/chat/completions {
        proxy_pass http://chat:8000/v1/chat/completions;
    }

    location = /v1/completions {
        proxy_pass http://chat:8000/v1/completions;
    }

    location = /v1/embeddings {
        proxy_pass http://embed:8000/v1/embeddings;
    }

    location = /v1/models {
        proxy_pass http://chat:8000/v1/models;
    }

    location = /v1/rerank {
        proxy_pass http://rerank:8000/v1/rerank;
    }

    location = /pooling {
        proxy_pass http://embed:8000/pooling;
    }

    location = /tokenize {
        proxy_pass http://embed:8000/tokenize;
    }
}
