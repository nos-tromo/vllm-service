# Docker's embedded DNS is required because some proxy_pass targets below
# use a variable hostname ($chat_upstream), which forces runtime resolution.
resolver 127.0.0.11 valid=30s ipv6=off;

# Route OpenAI-compatible chat/completions calls to the correct backend
# based on the "model" field in the JSON request body. Any model id
# containing "translate" (case-insensitive) is sent to the translate service;
# everything else falls through to the general chat service.
map $request_body $chat_upstream {
    default                                             chat;
    "~*\"model\"\s*:\s*\"[^\"]*translate[^\"]*\""       translate;
}

server {
    listen 9000;
    client_max_body_size 256m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location = /v1/audio/transcriptions {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://audio:8000/v1/audio/transcriptions;
    }

    location = /v1/audio/translations {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://audio:8000/v1/audio/translations;
    }

    location = /v1/chat/completions {
        # $request_body is only populated when the body is fully buffered in
        # memory. Bump the buffer so realistic chat payloads (long prompts,
        # many messages) do not spill to disk and blank out $request_body,
        # which would silently route translate calls to the chat service.
        client_body_buffer_size 2m;
        proxy_pass http://$chat_upstream:8000/v1/chat/completions;
    }

    location = /v1/completions {
        client_body_buffer_size 2m;
        proxy_pass http://$chat_upstream:8000/v1/completions;
    }

    location = /v1/embeddings {
        proxy_pass http://embed:8000/v1/embeddings;
    }

    location = /v1/models {
        # Note: only the general chat service is listed here. If clients need
        # to discover the translate model, extend this location or add a
        # dedicated aggregation endpoint.
        proxy_pass http://chat:8000/v1/models;
    }

    location = /v1/rerank {
        proxy_pass http://rerank:8000/v1/rerank;
    }

    location = /pooling {
        proxy_pass http://embed:8000/pooling;
    }

    location = /tokenize {
        proxy_pass http://embed:8000/tokenize;
    }
}
