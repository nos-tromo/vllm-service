[project]
name = "vllm-service"
version = "0.3.2"
description = "LiteLLM router + vLLM backends (lint config for the bundled FastAPI servers)."
requires-python = ">=3.11,<3.12"
# Light, *typed* deps shared by the bundled FastAPI servers. Declared so
# pyrefly's strict mode type-checks the first-party code against real FastAPI /
# pydantic / numpy types — without them, strict mode flags every BaseModel
# subclass and every @app route decorator (Any base / untyped decorator).
# The heavy ML backends (torch, transformers, openai-whisper, pyannote.audio,
# silero-vad) are deliberately NOT listed: they are installed only in the
# images, and pyrefly treats them as Any via ignore-missing-imports.
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.0",
    "numpy",
    "requests",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit",
    "pyrefly==1.1.1",
]
# Dev-only eval harness. `eval` is torch-free (pyannote.metrics/database/core are
# pure-python) so every unit test installs without torch. `eval-run` adds
# pyannote.audio (torch) and is needed only for real diarization runs (Task 8).
eval = [
    "pyannote.metrics>=3.2",
    "pyannote.database>=5.0",
    "pytest>=8",
    # FastAPI TestClient transport + multipart form parsing, for the src/
    # server unit tests.
    "httpx>=0.27",
    "python-multipart",
    "soundfile>=0.12",
    "pyyaml>=6",
    "scipy>=1.17.1",
]
eval-run = [
    # 4.x (not the production Docker's <4 pin): newer diarization models —
    # e.g. pyannote/speaker-diarization-community-1, which passes a `plda`
    # kwarg 3.x's SpeakerDiarization doesn't accept — require pyannote.audio 4.x.
    # This is a DEV-ONLY eval env; deploying such a model to the /diarize server
    # is a separate pyannote 3.x->4.x migration (renamed auth kwarg, torchcodec
    # decode). build_pipeline tolerates both majors' from_pretrained signatures.
    "pyannote.audio>=4,<5",
    # pyannote.audio imports matplotlib.pyplot at module load (undeclared in its
    # own metadata; the Docker base image happens to provide it).
    "matplotlib",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "D", "ANN", "UP", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
# Mirrors nos-tromo/.github/configs/python-strict/pyrefly.toml. Drift fails CI.
preset = "strict"
ignore-missing-imports = ["*"]
