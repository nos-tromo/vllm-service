[project]
name = "vllm-service"
version = "0.5.5"
description = "LiteLLM router + vLLM backends."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.0",
    "numpy",
    "requests",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit",
    "pyrefly==1.1.1",
]
eval = [
    "pyannote.metrics>=3.2",
    "pyannote.database>=5.0",
    "pytest>=8",
    "httpx>=0.27",
    "python-multipart",
    "soundfile>=0.12",
    "pyyaml>=6",
    "scipy>=1.17.1",
]
eval-run = [
    "pyannote.audio>=4,<5",
    # pyannote.audio imports matplotlib.pyplot at module load (undeclared in its
    # own metadata; the Docker base image happens to provide it).
    "matplotlib",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "D", "ANN", "UP", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
# Mirrors nos-tromo/.github/configs/python-strict/pyrefly.toml. Drift fails CI.
preset = "strict"
ignore-missing-imports = ["*"]
