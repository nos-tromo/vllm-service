[project]
name = "vllm-service"
version = "0.1.2"
description = "LiteLLM router + vLLM backends (lint config for the bundled FastAPI servers)."
requires-python = ">=3.11"
# Light, *typed* deps shared by the bundled FastAPI servers. Declared so
# pyrefly's strict mode type-checks the first-party code against real FastAPI /
# pydantic / numpy types — without them, strict mode flags every BaseModel
# subclass and every @app route decorator (Any base / untyped decorator).
# The heavy ML backends (torch, transformers, openai-whisper, pyannote.audio,
# silero-vad) are deliberately NOT listed: they are installed only in the
# images, and pyrefly treats them as Any via ignore-missing-imports.
dependencies = [
    "fastapi>=0.139.0",
    "pydantic>=2.0",
    "numpy",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit",
    "pyrefly==1.1.1",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "D", "ANN", "UP", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
# Mirrors nos-tromo/.github/configs/python-strict/pyrefly.toml. Drift fails CI.
preset = "strict"
ignore-missing-imports = ["*"]
